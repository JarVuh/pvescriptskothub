name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jarvuh/pvescriptskothub

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настройка Docker Buildx (необходима для быстрой сборки и правильного экспорта)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Исправлено: собираем образ, пушим его в GHCR и ОДНОВРЕМЕННО загружаем в локальный Docker-демон
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "."
          push: true
          load: true # <- ВАЖНО: это исправит ошибку "No such image" на шаге сохранения
          tags: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          cache-from: type=gha # Включает кэширование, чтобы повторные сборки летали
          cache-to: type=gha,mode=max

      # Исправлено: убрали локальные переменные внутри run, которые приводили к падению логов в Bash
      - name: Save Image to File
        run: |
          docker save -o image.tar ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          gzip -9 image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvescriptskothub-tar
          path: image.tar.gz
          retention-days: 3
