name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jarvuh/pvescriptskothub

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Строим образ локально и сразу тегируем его
      - name: Build Docker image locally
        run: |
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t $FULL_IMAGE_NAME .

      # Сохраняем уже готовый локальный образ в файл и сжимаем его
      - name: Save Image to File
        run: |
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker save -o image.tar $FULL_IMAGE_NAME
          gzip -9 image.tar

      # Отправляем этот же локальный образ в GHCR (чтобы не собирать заново)
      - name: Push Image to GHCR
        run: |
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push $FULL_IMAGE_NAME
