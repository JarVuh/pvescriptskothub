name: Build and Publish Docker Image to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'

env:
  IMAGE_NAME: jarvuv/pvescriptskothub

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Принудительно проверяем, передались ли секреты (если они пустые, билд упадет тут с понятной ошибкой)
      - name: Verify Secrets Availability
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: GitHub Actions не видит ваши секреты DOCKERHUB_USERNAME или DOCKERHUB_TOKEN!"
            echo "Проверьте вкладку Settings -> Secrets and variables -> Actions в вашем репозитории."
            exit 1
          fi

      # Прямая авторизация через официальный Docker CLI (минуя сторонние экшены)
      - name: Authenticate in Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Инициализируем стандартный системный сборщик
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Сборка и отправка
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: "${{ env.IMAGE_NAME }}:latest"
